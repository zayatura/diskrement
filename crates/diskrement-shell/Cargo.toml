[package]
name = "diskrement-shell"
description = "diskrement imperative shell: catalog, scanning, staging, burners"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
diskrement-core.workspace = true
chrono = { workspace = true, features = ["clock"] }
rayon.workspace = true
reflink-copy.workspace = true
rusqlite.workspace = true
# statvfs, for the room a read-back through xorriso needs (burn-verify spec
# §8.2). Already in the lockfile through tempfile.
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# Runtime, not just dev (spec §5.4 lists it under Dev): the media inspector,
# the disc reader and the tier-2 verifier all extract to a temporary file, and
# hand-rolling O_EXCL naming in a world-writable directory is a wheel with a
# symlink-attack surface. Already in the lockfile as a dev-dependency, so the
# dependency tree is unchanged.
tempfile.workspace = true
thiserror.workspace = true
walkdir.workspace = true

[features]
testutil = []

[dev-dependencies]
diskrement-shell = { path = ".", features = ["testutil"] }
proptest.workspace = true
tempfile.workspace = true
